name: Upstream stable release review

on:
  schedule:
    # Auckland 00:00 on the first falls on the prior month's last UTC day:
    # 11:00 UTC in NZDT or 12:00 UTC in NZST. Days 28-31 are candidates;
    # the guard requires local day 1, midnight, and the matching seasonal slot.
    - cron: '0 11 28-31 * *'
    - cron: '0 12 28-31 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-stable-review
  cancel-in-progress: false

jobs:
  review-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Gate scheduled checks to Auckland monthly midnight
        id: auckland
        run: python3 .github/scripts/auckland_schedule.py
      - name: Discover latest stable and open a draft review PR
        if: steps.auckland.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upstream-review.sh
